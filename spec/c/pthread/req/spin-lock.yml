text: |
  The ${../if/spin-lock:/name} function shall acquire the spin lock referenced by
  the ${../if/spin-lock:/params[0]/name} parameter as specified by
  ${/score/isr/req/lock-acquire:/spec} where the lock disables maskable
  interrupts at the acquire and restores their status from the lock object at the
  release.
