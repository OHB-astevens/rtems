- role: function-implementation
  uid: /score/isr/req/lock-fifo
rationale: null
requirement-type: functional
text: |
  The ${../if/spin-unlock:/name} function shall pass the spin lock referenced by
  the ${../if/spin-unlock:/params[0]/name} parameter to a waiting processor as
  specified by ${/score/isr/req/lock-fifo:/spec} where the lock disables maskable
  interrupts at the acquire and restores their status from the lock object at the
  release.
type: requirement
