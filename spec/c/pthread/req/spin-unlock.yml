text: |
  The ${../if/spin-unlock:/name} function shall release the spin lock referenced
  by the ${../if/spin-unlock:/params[0]/name} parameter as specified by
  ${/score/isr/req/lock-release:/spec} where the lock disables maskable
  interrupts at the acquire and restores their status from the lock object at the
  release.
